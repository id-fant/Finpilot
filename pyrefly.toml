# Keep the GitHub Actions Pyrefly step config-driven instead of passing each
# top-level folder as a CLI argument. Passing folders switches Pyrefly into
# single-file mode, where project-excludes from config are ignored.
project-includes = [
    "week1",
    "week2/core",
    "week2/finpilot",
    "week2/portfolio",
    "week2/signals",
    "week2/manage.py",
    "week2/smoke_test.py",
    "week3",
    "week4",
    "quant",
    "fastapi_spike",
    "scripts",
    "run.py",
]

project-excludes = [
    "**/.pytest_cache",
    "**/.pytest_cache/**",
    "**/__pycache__",
    "**/__pycache__/**",
    "**/.venv",
    "**/.venv/**",
    "**/venv",
    "**/venv/**",
]

search-path = [
    ".",
    "week1",
    "week2",
    "week3",
    "week4",
    "week4/broker",
    "fastapi_spike",
]

python-version = "3.13"
python-platform = "linux"
replace-imports-with-any = [
    "vectorbt",
    "faiss",
    # Django's ORM managers/admin/app config attributes are added dynamically.
    # Pyright remains the stricter checker for the Django surface; Pyrefly still
    # checks our non-framework code without reporting stub-model false positives.
    "django",
    "django.apps",
    "django.conf",
    "django.contrib",
    "django.contrib.admin",
    "django.core",
    "django.core.cache",
    "django.core.management",
    "django.core.management.base",
    "django.core.wsgi",
    "django.db",
    "django.db.models",
    "django.db.models.deletion",
    "django.db.transaction",
    "django.db.utils",
    "django.urls",
    "rest_framework",
    "rest_framework.generics",
    "rest_framework.response",
    "rest_framework.views",
    "celery",
    "celery.schedules",
    # Optional live-trading SDK; CI intentionally does not install it.
    "kiteconnect",
]
