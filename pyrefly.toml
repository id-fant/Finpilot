# Keep the GitHub Actions Pyrefly step config-driven instead of passing each
# top-level folder as a CLI argument. Passing folders switches Pyrefly into
# single-file mode, where project-excludes from config are ignored.
project-includes = [
    "week1",
    "week2/core",
    "week2/finpilot",
    "week2/portfolio",
    "week2/signals",
    "week2/manage.py",
    "week2/smoke_test.py",
    "week3",
    "week4",
    "quant",
    "fastapi_spike",
    "scripts",
    "run.py",
]

project-excludes = [
    "**/.pytest_cache",
    "**/.pytest_cache/**",
    "**/__pycache__",
    "**/__pycache__/**",
    "**/.venv",
    "**/.venv/**",
    "**/venv",
    "**/venv/**",
]

search-path = [
    ".",
    "week1",
    "week2",
    "week3",
    "week4",
    "week4/broker",
    "fastapi_spike",
    # scripts/ has no __init__.py — the supervisor imports its sibling
    # (run_integrated_demo) as a top-level module, mirroring sys.path at runtime.
    "scripts",
]

python-version = "3.13"
python-platform = "linux"
# Only the genuinely-uninstalled packages get replaced with Any. The CI
# install step deliberately skips these three:
#   vectorbt    — pulls numba, whose wheels lag on the newest Python
#   faiss       — ships native code; rag.py has a NumPy fallback anyway
#   kiteconnect — optional live-trading SDK, not needed to type-check
# Django / DRF / Celery are NOT listed here: their stubs (django-types,
# djangorestframework-types, django-stubs-ext) ARE installed in CI, so
# Pyrefly checks the framework surface for real. The few remaining stub
# false-positives are handled by per-line `# pyrefly: ignore[...]` comments.
replace-imports-with-any = [
    "vectorbt",
    "faiss",
    "kiteconnect",
]
