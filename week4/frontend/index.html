<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- WHY no-cache on the HTML itself: `python -m http.server` sends no cache
     headers, so the browser holds this file forever. But the ?v= cache-bust
     on the assets below only takes effect once the browser RE-READS this
     file — a chicken-and-egg trap where bumping the version does nothing
     because the stale index.html still points at the old versions. Forcing
     revalidation of the HTML (not the assets — those are versioned) breaks
     the loop: a version bump is now picked up on the next normal reload. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="description" content="FinPilot decision workspace for NIFTY 50 signals, paper trades, portfolio risk, and quantitative research." />
<meta name="theme-color" content="#f4f1e8" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>FinPilot — Trading intelligence, your way</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
