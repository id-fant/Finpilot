# FinPilot — Railway deploy configuration.
#
# Railway (railway.app) is a PaaS: it builds the image, runs `startCommand`,
# injects a $PORT, and terminates TLS for you — no nginx to manage.
#
# Deploy:  install the Railway CLI, then  `railway up`  from the repo root.
# Set DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS and any broker keys as Railway
# environment variables — never commit them.

[build]
builder = "DOCKERFILE"
dockerfilePath = "week4/Dockerfile"

[deploy]
# $PORT is provided by Railway at runtime.
startCommand = "python manage.py migrate --noinput && uvicorn finpilot.asgi:application --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers"
healthcheckPath = "/api/dashboard/snapshot/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
