name: ci

# Run on every push and pull request to main — small project, fast pipeline,
# no point gating only on push. The actual cost is the runner minute, which
# is free for public repos.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  type-check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # the suite is sub-second; anything past 10 min = something hung

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # Cache pip downloads — key on every requirements file so any edit
          # invalidates the cache and the lock stays accurate.
          cache: pip
          cache-dependency-path: |
            week1/requirements.txt
            week2/requirements.txt
            week3/requirements.txt
            quant/requirements.txt
            fastapi_spike/requirements.txt

      # Install every folder's deps. Why all of them: each folder declares
      # its own requirements.txt, and type-checking week1 (which imports
      # matplotlib + vectorbt) needs those packages resolvable. Without this
      # the CI fails on `Cannot find module matplotlib.pyplot` even though
      # the code itself is clean. pytest + pytest-django + the two type
      # checkers are dev concerns kept out of the per-folder requirements
      # so production installs stay lean.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # week1/week3 carry a couple of heavy optional deps (vectorbt pulls
          # numba; faiss-cpu ships native code) whose wheels lag on the very
          # latest Python. We strip them here and pass --replace-imports-with-any
          # to pyrefly below, matching the runtime guard (`vbt: Any = _vbt`).
          grep -v -E "^(vectorbt|faiss-cpu)" week1/requirements.txt > /tmp/w1.txt
          grep -v -E "^(faiss-cpu)" week3/requirements.txt > /tmp/w3.txt
          pip install -r /tmp/w1.txt
          pip install -r week2/requirements.txt
          pip install -r /tmp/w3.txt
          pip install -r quant/requirements.txt
          pip install -r fastapi_spike/requirements.txt
          pip install pytest pytest-django pyrefly pyright

      # ── Type check: every folder, with BOTH checkers. ──────────────────────
      # 0 errors is the gate from each; suppressions are allowed (annotated).
      # WHY two checkers: pyrefly and pyright disagree on pandas narrowing —
      # pyrefly accepts what pyright rejects on `df["col"]` (Series|DataFrame
      # union) and vice versa on `cast` redundancy. Running both catches both
      # families of stub-strictness issues that the IDE (Pylance/Pyright) sees.
      - name: Type check (pyrefly) — every folder
        run: |
          # --replace-imports-with-any silences the missing-import for the
          # two optional heavies we deliberately did NOT install above.
          # Same result as the inline `# pyrefly: ignore[missing-import]`
          # comments, just enforced at the command line so a future stub
          # bug or import error in those packages doesn't break CI either.
          for d in week1 week2 week3 week4 quant fastapi_spike; do
            echo "::group::pyrefly $d"
            pyrefly check "$d" \
              --replace-imports-with-any vectorbt \
              --replace-imports-with-any faiss
            echo "::endgroup::"
          done

      - name: Type check (pyright) — every folder
        run: |
          for d in week1 week2 week3 week4 quant fastapi_spike; do
            echo "::group::pyright $d"
            pyright "$d"
            echo "::endgroup::"
          done

      # ── Django sanity: settings load, models validate, migrations apply. ────
      - name: Django system check
        working-directory: week2
        run: python manage.py check

      - name: Django migration check (no pending migrations)
        working-directory: week2
        # --check exits non-zero if a makemigrations is needed — catches forgotten
        # schema changes BEFORE they cause a runtime error in prod.
        run: python manage.py makemigrations --check --dry-run

      # ── Pytest: engine unit tests + seed_demo integration tests. ────────────
      - name: Run pytest
        working-directory: week2
        run: pytest

      # ── Smoke test: full pipeline on synthetic data, no network. ────────────
      - name: Offline smoke test
        working-directory: week2
        run: python smoke_test.py --offline
